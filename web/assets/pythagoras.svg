<text x="56" y="58" fill="#b1bcb4" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12" letter-spacing="3">THE BEAUTY OF MATHEMATICS</text><text x="56" y="111" fill="#f4f0e5" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="bold">数学，可以看得见。</text><text x="56" y="141" fill="#8c9b91" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13">从一个直角三角形，理解勾股定理</text>
